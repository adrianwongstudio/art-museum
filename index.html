<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Long Room — a gallery you can walk through</title>
    <meta
      name="description"
      content="An eight-work exhibition you explore in first person. Walk up to each piece, read about it, and inquire about acquiring it."
    />
    <meta name="theme-color" content="#f2f0ec" />

    <!--
      Links into the gallery are meant to be shared (#/artwork/… opens standing in
      front of a work), so they should preview properly. No og:image yet: a
      photograph of an actual work is the right share card, and everything here is
      still placeholder.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Long Room" />
    <meta property="og:title" content="The Long Room — a gallery you can walk through" />
    <meta
      property="og:description"
      content="An eight-work exhibition you explore in first person. Walk up to each piece, read about it, and inquire about acquiring it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Long Room — a gallery you can walk through" />
    <meta
      name="twitter:description"
      content="An eight-work exhibition you explore in first person."
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f2f0ec'/%3E%3Crect x='7' y='6' width='18' height='14' fill='none' stroke='%231d1b18' stroke-width='2'/%3E%3Crect x='14' y='24' width='4' height='2' fill='%231d1b18'/%3E%3C/svg%3E" />
    <script>
      /*
       * Settle the theme before the first paint, or a visitor who has chosen the
       * dark gallery gets a white flash on every load. This is the same rule as
       * resolveInitialTheme() in src/ui/theme.js — stored choice, then system
       * preference, then the white cube — and the key must match THEME_STORAGE_KEY.
       */
      try {
        var saved = localStorage.getItem('the-long-room:theme');
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>

    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>
  <body>
    <!-- The 3D gallery -->
    <canvas id="scene" aria-hidden="true"></canvas>

    <!-- Loading / entrance -->
    <div id="loading" class="loading" role="dialog" aria-label="Entering the gallery">
      <div class="loading__inner">
        <p class="loading__eyebrow">Exhibition</p>
        <h1 class="loading__title">The Long Room</h1>
        <p class="loading__blurb">
          Eight works, one hall. Walk up to anything that catches your eye.
        </p>
        <div class="loading__bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="loading__fill" id="loading-fill"></div>
        </div>
        <p class="loading__pct" id="loading-pct">0%</p>
        <button id="enter" class="btn btn--primary" disabled>Enter the gallery</button>
      </div>
    </div>

    <!-- Site navigation, which owns the top-right corner -->
    <header id="topbar" class="topbar" role="banner">
      <nav id="nav" class="nav" aria-label="Site"></nav>
    </header>

    <!-- Standing pages, rendered in place of the room -->
    <div id="pages" class="pages" hidden></div>

    <!-- Head-up UI -->
    <button
      id="theme-toggle"
      class="btn btn--round theme-toggle"
      type="button"
      aria-label="Switch to the dark gallery"
      title="Switch to the dark gallery"
    >
      <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4.6" />
        <g stroke-linecap="round">
          <path d="M12 2.4v2.6M12 19v2.6M4.2 12H1.6M22.4 12h-2.6" />
          <path d="M6.1 6.1 4.3 4.3M19.7 19.7l-1.8-1.8M17.9 6.1l1.8-1.8M4.3 19.7l1.8-1.8" />
        </g>
      </svg>
      <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.4 14.6A8.6 8.6 0 0 1 9.4 3.6a8.6 8.6 0 1 0 11 11Z" />
      </svg>
    </button>

    <button id="skip" class="btn btn--ghost skip" hidden>Skip</button>

    <div id="hint" class="hint" hidden>
      <span class="hint__text"></span>
      <button class="hint__close" aria-label="Dismiss hint">&times;</button>
    </div>
    <button id="hint-toggle" class="btn btn--round hint-toggle" hidden aria-label="Show help">?</button>

    <nav id="dots" class="dots" aria-label="Works in this room" hidden></nav>

    <!-- Sliding information panel -->
    <aside id="panel" class="panel" aria-live="polite" hidden></aside>

    <!-- Artist overlay -->
    <div id="artist-view" class="overlay" role="dialog" aria-modal="true" hidden></div>

    <!-- Lightbox for works not hanging in the room -->
    <div id="lightbox" class="overlay overlay--lightbox" role="dialog" aria-modal="true" hidden></div>

    <!-- Accessible / no-WebGL surface. Populated from the same data as the 3D room. -->
    <main id="fallback" class="fallback" tabindex="-1"></main>

    <noscript>
      <p style="padding: 2rem; font: 1rem/1.6 Georgia, serif">
        The Long Room is an interactive exhibition that needs JavaScript. Please enable it,
        or write to us at hello@thelongroom.example for a catalogue.
      </p>
    </noscript>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
